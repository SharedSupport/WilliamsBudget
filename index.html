<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Household Ledger</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F3;
  --surface:#FFFFFF;
  --ink:#0E1A22;
  --muted:#5C6B77;
  --line:#D5DCE2;
  --deep:#12202B;
  --good:#0D6E62;
  --due:#9A5B12;
  --alert:#A8231C;
  --lift:0 1px 2px rgba(14,26,34,.06), 0 4px 14px rgba(14,26,34,.05);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

/* Header */
header{background:var(--deep);color:#EAF0F4;padding:calc(14px + env(safe-area-inset-top)) 0 20px;border-bottom-left-radius:20px;border-bottom-right-radius:20px}
header .eyebrow{color:#7EA0B4}
.hdrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hlogo{width:46px;height:46px;border-radius:12px;flex:none;margin-top:3px}
.locklogo{width:96px;height:96px;border-radius:22px;margin-bottom:14px}
.hbig{font-size:31px;font-weight:600;margin:2px 0 0;letter-spacing:-.02em}
.hsub{font-size:12.5px;color:#9DB6C6;margin-top:3px}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-size:12px;color:#CFE0EA;white-space:nowrap}
.hgear{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;width:30px;height:30px;display:grid;place-items:center;color:#CFE0EA;cursor:pointer;padding:0}
.hgear svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.statusbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:none;margin-top:8px}
.statusbar i{display:block;height:100%;border-radius:3px}
.statkey{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.statkey span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}

/* Runway: the signature element */
.runway{margin-top:18px}
.rbar{display:flex;height:34px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13)}
.rseg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;min-width:0;overflow:hidden;font-family:'IBM Plex Mono',monospace}
.rseg.bills{background:#C6763B;color:#2A1602}
.rseg.debt{background:#8E5C86;color:#22101F}
.rseg.save{background:#3E8F82;color:#04231F}
.rseg.left{background:#DDE6EC;color:#12202B}
.rseg.over{background:#A8231C;color:#fff}
.rkey{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px}
.rkey span{font-size:11px;color:#A9C0CE;display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}

/* Cards */
main{padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift);margin-bottom:12px;overflow:hidden}
.card>h2{margin:0;padding:13px 15px 0;font-size:13px;font-weight:600;letter-spacing:.01em}
.card>h2+.chelp,.mhead+.chelp{padding:2px 15px 0;font-size:12px;color:var(--muted);margin:0}
.mhead{display:flex;align-items:center;gap:8px;padding:11px 15px 0}
.mhead h2{margin:0;font-size:13px;font-weight:600;flex:1;text-align:center}
.mhead .btn.sm{padding:4px 12px}
.cbody{padding:13px 15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--lift)}
.stat .v{font-size:20px;font-weight:600;margin-top:4px}
.stat .n{font-size:11.5px;color:var(--muted);margin-top:2px}

/* Rows */
.row{display:flex;align-items:center;gap:11px;padding:11px 15px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:11.5px}
.row .amt{font-weight:600;font-size:15px;white-space:nowrap}
.chk{width:26px;height:26px;flex:none;border:1.5px solid var(--line);border-radius:7px;background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;font-size:14px;color:transparent}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.paid b,.paid .amt{color:var(--muted);text-decoration:line-through}
.tag{display:inline-block;font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:#E6EBEF;color:var(--muted)}
.tag.soon{background:#F6E7D3;color:var(--due)}
.tag.late{background:#F5DAD8;color:var(--alert)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px 15px 6px}
.cal .dow{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:2px}
.cday{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;border:1.5px solid transparent;background:none;padding:0;cursor:pointer;color:var(--ink);font-family:inherit}
.cday:disabled{cursor:default}
.cday.pay{background:#D9EBE6;color:var(--good);font-weight:600}
.cday.tod{border-color:var(--deep);font-weight:600}
.cday.sel{background:var(--deep);color:#fff}
.cday.sel.pay{background:var(--good);color:#fff}
.cday .dots{position:absolute;bottom:3px;display:flex;gap:2.5px}
.cday .dots i{width:4.5px;height:4.5px;border-radius:50%;display:block}
.callegend{display:flex;gap:14px;padding:2px 15px 12px;flex-wrap:wrap}
.callegend span{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}

/* Progress */
.pbar{height:7px;background:#E6EBEF;border-radius:4px;overflow:hidden;margin-top:7px}
.pbar i{display:block;height:100%;background:var(--good);border-radius:4px}
.pbar.debt i{background:#8E5C86}

/* Controls */
button,input,select,textarea{font-family:inherit;font-size:15px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:500;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.wide{width:100%;justify-content:center}
.btn.danger{color:var(--alert);border-color:#EBC9C6}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,.btn:focus-visible,.chk:focus-visible,.tab:focus-visible{outline:2px solid #2E7DA6;outline-offset:2px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tab{flex:1;border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);cursor:pointer;font-size:10.5px;font-weight:500}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--deep)}
.tab[aria-current="page"] svg{stroke-width:2.1}

/* Sheet */
.sheet{position:fixed;inset:0;background:rgba(14,26,34,.45);display:none;align-items:flex-end;z-index:60}
.sheet.on{display:flex}
.sheet>div{background:var(--paper);width:100%;max-width:640px;margin:0 auto;border-top-left-radius:18px;border-top-right-radius:18px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shead h3{margin:0;font-size:17px}
.empty{padding:22px 15px;text-align:center;color:var(--muted);font-size:13.5px}
table.prev{width:100%;border-collapse:collapse;font-size:12px}
table.prev th{text-align:left;font-weight:500;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:5px 6px;border-bottom:1px solid var(--line)}
table.prev td{padding:6px;border-bottom:1px solid var(--line)}
.pos{color:var(--good)}
.neg{color:var(--alert)}

/* PIN lock */
#lock{position:fixed;inset:0;background:var(--deep);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#lock.on{display:flex}
.lockbox{width:100%;max-width:300px;text-align:center;color:#EAF0F4}
.lockbox .eyebrow{color:#7EA0B4}
.lockbox h1{font-size:20px;font-weight:600;margin:6px 0 16px}
.lockbox input{text-align:center;font-size:24px;letter-spacing:.35em;font-family:'IBM Plex Mono',monospace;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;margin-bottom:10px}
.lockbox input:focus{outline:2px solid #2E7DA6;outline-offset:2px}
#pin-go{background:#EAF0F4;border-color:#EAF0F4;color:var(--deep);font-weight:600}
#pin-err{color:#F0A9A4;font-size:13px;min-height:18px;margin:10px 0 0}
body.locked{overflow:hidden}
.note{font-size:12px;color:var(--muted);margin:8px 2px 0}
@media (prefers-reduced-motion:no-preference){
  .card,.stat{animation:rise .3s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

<div id="lock" role="dialog" aria-modal="true" aria-label="Enter PIN">
  <div class="lockbox">
    <img class="locklogo" src="logo.png" alt="">
    <div class="eyebrow">Household Ledger</div>
    <h1>Enter PIN</h1>
    <input id="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="PIN">
    <button class="btn pri wide" id="pin-go">Unlock</button>
    <p id="pin-err"></p>
  </div>
</div>

<header>
  <div class="wrap" id="hdr"></div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabs" id="tabs"></nav>

<div class="sheet" id="sheet"><div id="sheetbody"></div></div>

<script>
/* ============================================================
   Household Ledger
   All data is stored on this device only. Nothing is uploaded.
   Seeded from the Modernized Financial Workbook (Aug 2026).
   ============================================================ */

/* ---------- storage (falls back to memory in sandboxed previews) ---------- */
const store = {
  mem:{}, ok:(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}})(),
  get(k){ try{ return this.ok ? localStorage.getItem(k) : (this.mem[k] ?? null) }catch(e){ return this.mem[k] ?? null } },
  set(k,v){ try{ this.ok ? localStorage.setItem(k,v) : (this.mem[k]=v) }catch(e){ this.mem[k]=v } }
};
const KEY='ledger.v1';

/* ---------- seed ---------- */
function seed(){ return {
  version:1,
  income:{ people:[{name:'Maxine',amount:1902.67},{name:'Ryan',amount:2002.76}], anchorPayday:'2026-08-14' },
  bills:[
    {id:'b1',name:'Mortgage (half)',    amount:1084, freq:'perpaycheck',          cat:'Housing'},
    {id:'b2',name:'Daycare',            amount:379,  freq:'weekly',    weekday:5, cat:'Childcare'},
    {id:'b3',name:'Car / Life Insurance',amount:325, freq:'monthly',   dueDay:20, cat:'Insurance'},
    {id:'b4',name:'Phone',              amount:169,  freq:'monthly',   dueDay:21, cat:'Utilities'},
    {id:'b5',name:'Water / Sewer',      amount:110,  freq:'quarterly', dueDay:23, anchorMonth:8, cat:'Utilities', check:true},
    {id:'b6',name:'Electric',           amount:597,  freq:'monthly',   dueDay:24, cat:'Utilities'},
    {id:'b7',name:'Internet',           amount:105,  freq:'monthly',   dueDay:25, cat:'Utilities'},
    {id:'b8',name:'Trash',              amount:30,   freq:'monthly',   dueDay:15, cat:'Utilities'},
    {id:'b9',name:'Gym membership',     amount:70,   freq:'monthly',   dueDay:1,  cat:'Personal'}
  ],
  debts:[
    {id:'d1',name:'Amazon Card',  balance:350.03,  apr:.29,  min:40,     dueDay:3},
    {id:'d2',name:'Equity Loan',  balance:43984.84,apr:.12,  min:474,    dueDay:1},
    {id:'d3',name:'Venture Card', balance:391.00,  apr:.29,  min:0,      dueDay:7},
    {id:'d4',name:'Target Card',  balance:0,       apr:.29,  min:0,      dueDay:10},
    {id:'d5',name:'Lowes Card',   balance:0,       apr:.29,  min:0,      dueDay:5},
    {id:'d6',name:'Student Loans',balance:99739.38,apr:.055, min:575.83, dueDay:17, pslf:true},
    {id:'d7',name:'Medical Bills',balance:400,     apr:0,    min:80,     dueDay:28}
  ],
  funds:[
    {id:'f1',name:'Emergency Fund',balance:686,goal:2000,target:'2027-08-14'},
    {id:'f2',name:'Christmas Fund',balance:0,  goal:2000,target:'2026-12-01'},
    {id:'f3',name:'Vacation Fund', balance:0,  goal:5000,target:'2027-08-14'},
    {id:'f4',name:'Home Repairs',  balance:0,  goal:1000,target:'2027-08-14'}
  ],
  budgets:{Groceries:600,Gas:200,Restaurants:150,Entertainment:100,Household:100,Personal:100},
  smooth:true,
  pslf:{made:71,required:120},
  assets:{'Checking / Cash':0,'Retirement / Investments':0,'Home / Property':0,'Other':0},
  paid:{}, txns:[], deleted:[],
  rules:[
    {m:'weis',c:'Groceries'},{m:'giant',c:'Groceries'},{m:'aldi',c:'Groceries'},{m:'wegmans',c:'Groceries'},
    {m:'sheetz',c:'Gas'},{m:'turkey hill',c:'Gas'},{m:'sunoco',c:'Gas'},{m:'exxon',c:'Gas'},{m:'wawa',c:'Gas'},
    {m:'dunkin',c:'Restaurants'},{m:'mcdonald',c:'Restaurants'},{m:'pizza',c:'Restaurants'},
    {m:'netflix',c:'Entertainment'},{m:'spotify',c:'Entertainment'},{m:'apple.com',c:'Entertainment'},
    {m:'amazon',c:'Household'},{m:'walmart',c:'Household'},{m:'wal-mart',c:'Household'},{m:'target',c:'Household'},
    {m:'lowes',c:'Household'},{m:'dollar',c:'Household'},{m:'harbor freight',c:'Household'}
  ]
};}

let D = (()=>{ const r=store.get(KEY); if(!r) return seed();
  try{ const p=JSON.parse(r); return Object.assign(seed(),p); }catch(e){ return seed(); } })();
const save=(queue=true)=>{
  D.updatedAt=Date.now(); store.set(KEY,JSON.stringify(D));
  if(queue&&SYNC&&SYNC.token){ clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,2500); }
};

/* ---------- helpers ---------- */
const CATS=['Groceries','Gas','Restaurants','Entertainment','Household','Personal','Other'];
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:Math.abs(n)>=1000?0:2}).format(n||0);
const money2=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const D0=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const today=()=>D0(new Date());
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const mkey=d=>iso(d).slice(0,7);
const fmtD=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const days=(a,b)=>Math.round((D0(b)-D0(a))/864e5);
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

const biweekly=()=>D.income.people.reduce((s,p)=>s+(+p.amount||0),0);
function paydays(from,to){
  const a=parseD(D.income.anchorPayday); const out=[];
  let d=new Date(a);
  while(d<from) d.setDate(d.getDate()+14);
  while(d>from){ const p=new Date(d); p.setDate(p.getDate()-14); if(p<from) break; d=p; }
  while(d<=to){ out.push(new Date(d)); d.setDate(d.getDate()+14); }
  return out;
}
function nextPayday(){ const t=today(); const l=paydays(t,new Date(t.getFullYear(),t.getMonth()+3,1)); return l.find(d=>d>=t)||l[0]; }
function periodStart(){
  const t=today(); const a=parseD(D.income.anchorPayday);
  let d=new Date(a);
  if(d>t){ while(d>t) d.setDate(d.getDate()-14); }
  else { while(true){ const n=new Date(d); n.setDate(n.getDate()+14); if(n>t) break; d=n; } }
  return d;
}

/* bill occurrences inside [from,to] */
function occurrences(b,from,to){
  const out=[]; const push=d=>{ if(d>=from&&d<=to) out.push(new Date(d)); };
  const clampDay=(y,m,day)=>new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));
  if(b.freq==='perpaycheck'){
    paydays(from,to).forEach(push);
  } else if(b.freq==='weekly'||b.freq==='biweekly'){
    const step=b.freq==='weekly'?7:14;
    let d=new Date(from); const wd=(b.weekday??5);
    d.setDate(d.getDate()+((wd-d.getDay()+7)%7));
    while(d<=to){ push(d); d=new Date(d); d.setDate(d.getDate()+step); }
  } else if(b.freq==='monthly'){
    for(let y=from.getFullYear(),m=from.getMonth(); new Date(y,m,1)<=to; m++){
      if(m>11){m=0;y++;} push(clampDay(y,m,b.dueDay||1));
    }
  } else if(b.freq==='quarterly'||b.freq==='annual'){
    const step=b.freq==='quarterly'?3:12; const am=(b.anchorMonth||1)-1;
    for(let y=from.getFullYear()-1;y<=to.getFullYear()+1;y++)
      for(let m=am%step;m<12;m+=step){ if(((m-am)%step+step)%step===0) push(clampDay(y,m,b.dueDay||1)); }
  }
  return out.sort((a,b)=>a-b);
}
function billsBetween(from,to){
  const out=[];
  D.bills.forEach(b=>occurrences(b,from,to).forEach(d=>out.push({bill:b,date:d,amount:+b.amount||0,kind:'bill'})));
  D.debts.filter(d=>+d.min>0).forEach(dt=>{
    const b={freq:'monthly',dueDay:dt.dueDay};
    occurrences(b,from,to).forEach(d=>out.push({bill:{id:'debt_'+dt.id,name:dt.name,cat:'Debt'},date:d,amount:+dt.min,kind:'debt'}));
  });
  return out.sort((a,b)=>a.date-b.date);
}
/* ---------- payment smoothing ----------
   A bill may be PAID one paycheck before it is DUE. When smoothing is on,
   adjacent pay periods are leveled: while a period carries more than the
   one before it, its best-fitting bill slides back, so shorts are absorbed
   by lighter checks and leftovers even out. Per-paycheck items never move. */
function buildPlan(n){
  const ps=periodStart(), periods=[], items=[];
  for(let i=0;i<n;i++){
    const s=new Date(ps); s.setDate(s.getDate()+14*i);
    const e=new Date(s); e.setDate(e.getDate()+13);
    periods.push({start:s,end:e});
    billsBetween(s,e).forEach(it=>items.push(Object.assign({},it,{due:i,at:i})));
  }
  if(D.smooth!==false){
    const load=i=>items.reduce((s,x)=>s+(x.at===i?x.amount:0),0);
    for(let pass=0;pass<10;pass++){
      let moved=false;
      for(let i=1;i<n;i++){
        while(true){
          const li=load(i),lp=load(i-1);
          if(li<=lp+0.01) break;
          let best=null,bestDiff=li-lp;
          items.forEach(x=>{
            if(x.at!==i||x.due!==i||x.bill.freq==='perpaycheck') return;
            const d=Math.abs((li-x.amount)-(lp+x.amount));
            if(d<bestDiff-0.01){bestDiff=d;best=x;}
          });
          if(!best) break;
          best.at=i-1; moved=true;
        }
      }
      if(!moved) break;
    }
  }
  periods.forEach((p,i)=>{
    p.items=items.filter(x=>x.at===i).map(x=>{x.early=x.at<x.due;return x;}).sort((a,b)=>a.date-b.date);
  });
  return periods;
}

const paidKey=it=>`${iso(it.date)}|${it.bill.id}`;
const isPaid=it=>{ const m=mkey(it.date); return !!(D.paid[m]&&D.paid[m].includes(paidKey(it))); };
function togglePaid(it){
  const m=mkey(it.date); D.paid[m]=D.paid[m]||[]; const k=paidKey(it);
  const i=D.paid[m].indexOf(k); i>=0?D.paid[m].splice(i,1):D.paid[m].push(k); save();
}
const monthlyEq=b=>({weekly:52/12,biweekly:26/12,perpaycheck:26/12,monthly:1,quarterly:1/3,annual:1/12}[b.freq]||1)*(+b.amount||0);
const totalDebt=()=>D.debts.reduce((s,d)=>s+(+d.balance||0),0);
const totalFunds=()=>D.funds.reduce((s,f)=>s+(+f.balance||0),0);
const totalAssets=()=>Object.values(D.assets).reduce((s,v)=>s+(+v||0),0)+totalFunds();

/* ---------- dashboard charts (inline SVG, app palette) ---------- */
const MONO='IBM Plex Mono,monospace';
function svgChecks(){
  const plan=buildPlan(8), pay=biweekly();
  const tots=plan.map(p=>p.items.reduce((s,x)=>s+x.amount,0));
  const W=352,CB=112,H=132,n=plan.length,bw=W/n;
  const max=Math.max(pay,...tots)*1.12;
  const y=v=>CB-(v/max)*(CB-14);
  const py=y(pay);
  let s=`<line x1="0" y1="${py}" x2="${W}" y2="${py}" stroke="#8AA5B5" stroke-width="1" stroke-dasharray="3 3"/>`
       +`<text x="${W-2}" y="${py-4}" text-anchor="end" font-size="8.5" fill="var(--muted)" font-family="${MONO}">pay ${money(pay)}</text>`;
  plan.forEach((p,i)=>{
    const t=tots[i],bx=i*bw+5,w=bw-10,by=y(t),over=t>pay;
    s+=`<rect x="${bx}" y="${by}" width="${w}" height="${Math.max(3,CB-by)}" rx="4" fill="${over?'var(--alert)':'#3E8F82'}" data-goto="${i}" style="cursor:pointer"><title>${fmtD(p.start)}: ${money2(t)} in bills, ${money2(pay-t)} ${t>pay?'short':'left'}</title></rect>`;
    s+=`<text x="${bx+w/2}" y="${CB+13}" text-anchor="middle" font-size="8.5" fill="var(--muted)" font-family="${MONO}">${p.start.getMonth()+1}/${p.start.getDate()}</text>`;
  });
  const hi=tots.indexOf(Math.max(...tots)), lo=tots.indexOf(Math.min(...tots));
  [...new Set([hi,lo])].forEach(i=>{
    s+=`<text x="${i*bw+bw/2}" y="${y(tots[i])-4}" text-anchor="middle" font-size="8.5" fill="var(--ink)" font-family="${MONO}">${money(tots[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Bills per upcoming paycheck">${s}</svg>`;
}
function spendMonths(n){
  const t=today(),out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(t.getFullYear(),t.getMonth()-i,1),k=mkey(d);
    out.push({label:d.toLocaleDateString('en-US',{month:'short'}),
      amt:D.txns.filter(x=>x.date.slice(0,7)===k&&x.amount<0).reduce((s,x)=>s+(-x.amount),0)});
  }
  return out;
}
function svgSpend(data,budget){
  const W=352,CB=78,H=96,n=data.length,bw=W/n;
  const max=Math.max(budget||0,...data.map(d=>d.amt),1)*1.15;
  const y=v=>CB-(v/max)*(CB-12);
  let s='';
  if(budget){const by=y(budget);
    s+=`<line x1="0" y1="${by}" x2="${W}" y2="${by}" stroke="#8AA5B5" stroke-width="1" stroke-dasharray="3 3"/>`
      +`<text x="${W-2}" y="${by-3}" text-anchor="end" font-size="8.5" fill="var(--muted)" font-family="${MONO}">budget ${money(budget)}</text>`;}
  data.forEach((d,i)=>{
    const bx=i*bw+4,w=bw-8,by=y(d.amt),over=budget&&d.amt>budget;
    s+=`<rect x="${bx}" y="${by}" width="${w}" height="${Math.max(2,CB-by)}" rx="3.5" fill="${over?'var(--alert)':i===n-1?'#0D6E62':'#9CC9BE'}"><title>${d.label}: ${money2(d.amt)}</title></rect>`;
    s+=`<text x="${bx+w/2}" y="${CB+12}" text-anchor="middle" font-size="8.5" fill="var(--muted)" font-family="${MONO}">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Spending by month">${s}</svg>`;
}

const ord=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10)<4?n%10:0]||'th');

function calCard(){
  const t=today();
  const m0=new Date(t.getFullYear(),t.getMonth()+COFF,1);
  const me=new Date(m0.getFullYear(),m0.getMonth()+1,0);
  const items=billsBetween(m0,me);
  const byDay={}; items.forEach(i=>{ (byDay[iso(i.date)]=byDay[iso(i.date)]||[]).push(i); });
  const pds=new Set(paydays(m0,me).map(iso));
  const ti=iso(t);
  let cells='';
  for(let i=0;i<m0.getDay();i++) cells+='<span></span>';
  for(let d=1;d<=me.getDate();d++){
    const di=iso(new Date(m0.getFullYear(),m0.getMonth(),d));
    const due=byDay[di]||[];
    const dots=due.slice(0,3).map(i=>`<i style="background:${i.kind==='debt'?'#8E5C86':'#C6763B'}"></i>`).join('');
    cells+=`<button class="cday ${pds.has(di)?'pay':''} ${di===ti?'tod':''} ${di===CSEL?'sel':''}"
      data-cal="${di}" aria-label="${di}">${d}${dots?`<span class="dots">${dots}</span>`:''}</button>`;
  }

function incomeExpenseMonths(n){
  const t=today(),out=[],pay=biweekly();
  for(let i=n-1;i>=0;i--){
    const d=new Date(t.getFullYear(),t.getMonth()-i,1),me=new Date(d.getFullYear(),d.getMonth()+1,0),k=mkey(d);
    out.push({label:d.toLocaleDateString('en-US',{month:'short'}),
      inc:paydays(d,me).length*pay,
      exp:billsBetween(d,me).reduce((s,x)=>s+x.amount,0)
         +D.txns.filter(x=>x.date.slice(0,7)===k&&x.amount<0).reduce((s,x)=>s+(-x.amount),0)});
  }
  return out;
}
function svgIncExp(data){
  const W=352,CB=104,H=122,n=data.length,bw=W/n;
  const max=Math.max(...data.map(d=>Math.max(d.inc,d.exp)),1)*1.12;
  const y=v=>CB-(v/max)*(CB-10);
  let s='';
  data.forEach((d,i)=>{
    const x0=i*bw+5,w=(bw-12)/2;
    s+=`<rect x="${x0}" y="${y(d.inc)}" width="${w}" height="${Math.max(2,CB-y(d.inc))}" rx="3.5" fill="#2E9B87"><title>${d.label} income: ${money2(d.inc)}</title></rect>`;
    s+=`<rect x="${x0+w+2}" y="${y(d.exp)}" width="${w}" height="${Math.max(2,CB-y(d.exp))}" rx="3.5" fill="#C6763B"><title>${d.label} bills + spending: ${money2(d.exp)}</title></rect>`;
    s+=`<text x="${x0+w+1}" y="${CB+12}" text-anchor="middle" font-size="8.5" fill="var(--muted)" font-family="${MONO}">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Income versus expenses by month">${s}</svg>`;
}

/* ---------- PDF statement import ---------- */
let PDFROWS=null;
async function pdfLines(buf){
  const pdfjs=await import('./vendor/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.mjs';
  const doc=await pdfjs.getDocument({data:buf}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    const rows={};
    tc.items.forEach(it=>{ if(!it.str.trim()) return;
      const y=Math.round(it.transform[5]/3)*3; (rows[y]=rows[y]||[]).push(it); });
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
      lines.push(rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim());
    });
  }
  if(!lines.length) throw new Error('no text found');
  return lines;
}
/* One transaction per line: a leading date, a description, then amount and
   (usually) a running balance. When a line carries several money values the
   LAST is the balance and the one before it is the amount. Trailing-minus
   statements (12.34-) carry explicit signs; otherwise deposit keywords
   decide. Section headers like "CHECKING ID 40" tag the account, and
   transfers between the household's own shares are skipped. */
function txnsFromLines(lines){
  const ym=lines.join(' ').match(/20\d{2}/), fy=ym?+ym[0]:today().getFullYear();
  const MONEY=/\(?\$?\s?(-?)([\d,]+\.\d{2})(-?)\)?/g;
  const explicit=lines.some(L=>/[\d,]+\.\d{2}-(\s|$)/.test(L));
  const DATE=/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\s+/;
  let acct='';
  const out=[];
  lines.forEach(L=>{
    const ah=L.match(/^([A-Za-z][\w .&'-]{2,30}?)\s+ID\s+\d+\b/);
    if(ah){ acct=ah[1].trim(); return; }
    const dm=L.match(DATE); if(!dm) return;
    if(/beginning balance|ending balance|total (deposits|withdrawals)|year-to-date/i.test(L)) return;
    const toks=[...L.matchAll(MONEY)]; if(!toks.length) return;
    const tk=toks.length>=2?toks[toks.length-2]:toks[0];
    let a=parseFloat(tk[2].replace(/,/g,'')); if(!a||isNaN(a)) return;
    const neg=tk[1]==='-'||tk[3]==='-'||tk[0].trim().startsWith('(');
    let desc=L.slice(dm[0].length,tk.index).trim();
    if(/transfer (to|from) (share|shr)/i.test(desc)) return;
    desc=desc.replace(/^((recurring )?withdrawal|deposit|ach (debit|credit)?|pos)\b[: ]*/i,'')
      .replace(/debit card .*?post: ?\d{1,2}\/\d{1,2}/i,'')
      .replace(/pos #\d+/i,'')
      .replace(/eff\. ?date \d{1,2}\/\d{1,2}.*/i,'')
      .replace(/\b\d{6,}\b/g,'')
      .replace(/\s+\d(?=\s|$)/g,'')
      .replace(/\s+/g,' ').trim();
    if(!desc) desc='(no description)';
    if(neg) a=-Math.abs(a);
    else if(!explicit&&!/deposit|payroll|direct dep|credit|refund|interest/i.test(L)) a=-a;
    const y=dm[3]?(+dm[3]<100?2000+ +dm[3]:+dm[3]):fy;
    const d=new Date(y,+dm[1]-1,+dm[2]); if(isNaN(d)) return;
    out.push({id:uid(),date:iso(d),desc:desc.slice(0,60),amount:a,category:catFor(desc),account:acct||undefined});
  });
  return out;
}
function pdfPreview(){
  const rows=PDFROWS||[];
  if(!rows.length){ document.getElementById('csv-map').innerHTML='<p class="note" style="color:var(--alert)">No transaction lines recognized in that statement. Send a page of it to Claude and the reader can be tuned &mdash; or use the CSV export.</p>'; return; }
  const dupes=rows.filter(r=>D.txns.some(t=>t.date===r.date&&t.amount===r.amount&&t.desc===r.desc)).length;
  const accts=[...new Set(rows.map(r=>r.account||'Statement'))];
  const sum=l=>l.reduce((s,x)=>s+(x.amount<0?-x.amount:0),0);
  document.getElementById('csv-map').innerHTML=`
    <p class="note">${rows.length} transactions recognized${dupes?`, ${dupes} duplicates will be skipped`:''}. Internal transfers between your own accounts were left out. Untick any account that is not household spending.</p>
    ${accts.map(a=>{const l=rows.filter(r=>(r.account||'Statement')===a);
      return `<label style="display:flex;gap:8px;align-items:center;font-size:13.5px;margin:5px 2px"><input type="checkbox" class="pdf-acct" value="${esc(a)}" checked> <b>${esc(a)}</b>&nbsp;&middot; ${l.length} txns &middot; ${money(sum(l))} out</label>`;}).join('')}
    <table class="prev" style="margin-top:8px"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>
    ${rows.slice(0,14).map(r=>`<tr><td class="num">${esc(r.date.slice(5))}</td><td>${esc(r.desc.slice(0,26))}</td><td>${r.category?esc(r.category):'&mdash;'}</td><td class="num ${r.amount>0?'pos':''}" style="text-align:right">${money2(r.amount)}</td></tr>`).join('')}
    </tbody></table>
    <button class="btn pri wide" data-act="pdf-import" style="margin-top:12px">Import selected accounts</button>`;
}
function parseCSV(text){
  const rows=[]; let row=[],cell='',q=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  const clean=rows.filter(r=>r.some(c=>c.trim()!==''));
  if(clean.length<2) throw new Error('empty');
  return {head:clean[0].map(h=>h.trim()),rows:clean.slice(1)};
}
function guess(head,words){ const i=head.findIndex(h=>words.some(w=>h.toLowerCase().includes(w))); return i<0?0:i; }
function mapUI(){
  const h=CSV.head;
  const opt=sel=>h.map((c,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(c||'Column '+(i+1))}</option>`).join('');
  document.getElementById('csv-map').innerHTML=`
    <div class="f2">
      <label class="f"><span>Date column</span><select id="m-date">${opt(guess(h,['date','posted']))}</select></label>
      <label class="f"><span>Description column</span><select id="m-desc">${opt(guess(h,['desc','name','memo','payee','merchant']))}</select></label>
    </div>
    <div class="f2">
      <label class="f"><span>Amount column</span><select id="m-amt">${opt(guess(h,['amount','debit','value']))}</select></label>
      <label class="f"><span>Purchases show as</span><select id="m-sign">
        <option value="neg">Negative numbers</option><option value="pos">Positive numbers</option></select></label>
    </div>
    <button class="btn wide" data-act="csv-preview">Preview ${CSV.rows.length} rows</button>
    <div id="csv-prev"></div>`;
}
function catFor(desc){ const d=(desc||'').toLowerCase(); const r=D.rules.find(r=>d.includes(r.m)); return r?r.c:''; }
function csvRows(){
  const di=+document.getElementById('m-date').value, si=+document.getElementById('m-desc').value,
        ai=+document.getElementById('m-amt').value, sign=document.getElementById('m-sign').value;
  return CSV.rows.map(r=>{
    let raw=(r[ai]||'').replace(/[$,\s]/g,'').replace(/^\((.*)\)$/,'-$1');
    let amt=parseFloat(raw); if(isNaN(amt)) return null;
    if(sign==='pos') amt=-Math.abs(amt);
    const d=new Date(r[di]); if(isNaN(d)) return null;
    const desc=(r[si]||'').trim();
    return {id:uid(),date:iso(d),desc,amount:amt,category:catFor(desc)};
  }).filter(Boolean);
}
function csvPreview(){

  const uncat=rows.filter(r=>!r.category).length;
  document.getElementById('csv-prev').innerHTML=`

    ${rows.slice(0,12).map(r=>`<tr><td class="num">${esc(r.date.slice(5))}</td><td>${esc(r.desc.slice(0,28))}</td><td>${esc(r.category||'—')}</td><td class="num ${r.amount>0?'pos':''}" style="text-align:right">${money2(r.amount)}</td></tr>`).join('')}

/* ---------- GitHub sync ----------
   Both devices read/write one ledger.json in a PRIVATE repo through the
   GitHub contents API. The token is a fine-grained PAT limited to that
   repo, stored only in this device's localStorage. */
const SYNCKEY='ledger.sync';
let SYNC=(()=>{ try{ return JSON.parse(store.get(SYNCKEY))||null }catch(e){ return null } })();
let syncTimer=null;
const syncState={busy:false,again:false,last:store.get('ledger.synced')||'',err:''};

const b64e=s=>{ const u=new TextEncoder().encode(s); let b='';
  for(let i=0;i<u.length;i+=8192) b+=String.fromCharCode(...u.subarray(i,i+8192)); return btoa(b); };
const b64d=s=>{ const b=atob(s.replace(/\s/g,'')); const u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return new TextDecoder().decode(u); };
const ghURL=()=>`https://api.github.com/repos/${SYNC.repo}/contents/${SYNC.path||'ledger.json'}`;
const ghHdrs=()=>({Authorization:'Bearer '+SYNC.token,Accept:'application/vnd.github+json'});

function syncStatusText(){
  if(!SYNC) return 'Turn on sync to share one budget across your phones.';
  if(syncState.busy) return 'Syncing…';
  if(syncState.err) return 'Sync problem: '+syncState.err;
  return syncState.last?'Last synced '+syncState.last:'Not synced yet.';
}
function paintSync(){ const el=document.getElementById('sync-status'); if(el) el.textContent=syncStatusText(); }

/* Newer document wins field-by-field; transactions and paid marks are
   merged as unions so edits from both phones survive. */
function mergeDocs(a,b){
  if(!a) return b; if(!b) return a;
  const [base,other]=(+a.updatedAt||0)>=(+b.updatedAt||0)?[a,b]:[b,a];
  const m=JSON.parse(JSON.stringify(base));
  m.txns=m.txns||[]; m.paid=m.paid||{};
  const has=t=>m.txns.some(x=>x.id===t.id||(x.date===t.date&&x.amount===t.amount&&x.desc===t.desc));
  (other.txns||[]).forEach(t=>{ if(!has(t)) m.txns.push(t); });
  Object.entries(other.paid||{}).forEach(([mo,ks])=>{ m.paid[mo]=[...new Set([...(m.paid[mo]||[]),...ks])]; });
  // deletions win over the union, so removing a transaction sticks across devices
  const del=new Set([...(m.deleted||[]),...(other.deleted||[])]);
  m.deleted=[...del].slice(-800);
  m.txns=m.txns.filter(t=>!del.has(t.id));
  return m;
}

async function syncNow(){
  if(!SYNC||!SYNC.token) return;
  if(syncState.busy){ syncState.again=true; return; }
  syncState.busy=true; syncState.err=''; paintSync();
  try{
    const r=await fetch(ghURL(),{headers:ghHdrs()});
    let sha=null, remote=null;
    if(r.status===200){ const j=await r.json(); sha=j.sha; remote=JSON.parse(b64d(j.content)); }
    else if(r.status!==404) throw new Error(r.status===401?'token rejected':r.status===403?'no access to repo':'GitHub said '+r.status);
    D=Object.assign(seed(),mergeDocs(D,remote)); save(false);
    const body=JSON.stringify(D,null,1);
    if(!remote||JSON.stringify(Object.assign(seed(),remote),null,1)!==body){
      const w=await fetch(ghURL(),{method:'PUT',headers:ghHdrs(),
        body:JSON.stringify({message:'ledger sync',content:b64e(body),sha:sha||undefined})});
      if(!w.ok) throw new Error(w.status===409?'edited elsewhere, try again':'save failed ('+w.status+')');
    }
    syncState.last=new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    store.set('ledger.synced',syncState.last);
    render();
  }catch(e){ syncState.err=e.message==='Failed to fetch'?'offline or blocked':e.message; }
  syncState.busy=false; paintSync();
  if(syncState.again){ syncState.again=false; syncNow(); }
}

  else if(a==='mnow'){ MOFF=0; render(); }

    const x=D.txns.find(t=>t.id===v('td-id')); if(!x) return closeSheet();
    const amt=parseFloat(v('td-amt')); if(isNaN(amt)) return g('td-amt').focus();

    x.category=v('td-cat'); x.notes=v('td-notes');
    save(); closeSheet(); render();
  }
  else if(a==='td-del'){
    if(confirm('Delete this transaction?')){
      D.deleted=(D.deleted||[]).concat(v('td-id')).slice(-800);
      D.txns=D.txns.filter(t=>t.id!==v('td-id')); save(); closeSheet(); render();

    const on=new Set([...document.querySelectorAll('.pdf-acct:checked')].map(i=>i.value));
    (PDFROWS||[]).filter(r=>on.has(r.account||'Statement')).forEach(r=>{

  }
  else if(a==='clear-month'){
    const m=mkey(viewMonth());
    const doomed=D.txns.filter(x=>x.date.slice(0,7)===m);
    if(doomed.length&&confirm(`Delete all ${doomed.length} transactions in this month? Bills and paid checkmarks are not affected.`)){
      D.deleted=(D.deleted||[]).concat(doomed.map(x=>x.id)).slice(-800);
      D.txns=D.txns.filter(x=>x.date.slice(0,7)!==m);
      save(); render();
    }

  else if(a==='csv-preview'){ csvPreview(); }
  else if(a==='csv-import'){
    csvRows().forEach(r=>{ if(!D.txns.some(t=>t.date===r.date&&t.amount===r.amount&&t.desc===r.desc)) D.txns.push(r); });
    save(); closeSheet(); TAB='spend'; render();
  }
  else if(a==='export'){
    const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob), link=document.createElement('a');
    link.href=url; link.download=`ledger-backup-${iso(today())}.json`; link.click(); URL.revokeObjectURL(url);
  }
  else if(a==='import-json'){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.onchange=()=>{ const r=new FileReader();
      r.onload=()=>{ try{ D=Object.assign(seed(),JSON.parse(r.result)); save(); render(); }
                     catch(err){ alert('That file could not be read as a backup.'); } };
      r.readAsText(inp.files[0]); };
    inp.click();
  }
  else if(a==='reset'){
    if(confirm('This clears everything on this device and reloads the starting numbers. Export a backup first if you want to keep it.')){
      D=seed(); save(); render();
    }
  }
});

/* ---------- PIN lock ----------
   Keeps casual visitors out of the app screen. It is NOT encryption:
   the app shell and seed figures are readable in the page source
   regardless, and the hash below can be brute-forced offline. */
const PIN_HASH='5250d223be7bfba78d903ae226a7ed27cd5a282808082c4bb55b45dde4721688';
const sget=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const sset=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
(function lockInit(){
  // crypto.subtle needs a secure context (https / localhost); skip the gate elsewhere
  if(!(window.crypto&&crypto.subtle)||sget('ledger.unlocked')==='1') return;
  const el=document.getElementById('lock'), inp=document.getElementById('pin-in'), err=document.getElementById('pin-err');
  el.classList.add('on'); document.body.classList.add('locked');
  const tryPin=async()=>{
    if(!inp.value) return inp.focus();
    if(await sha256(inp.value)===PIN_HASH){
      sset('ledger.unlocked','1');
      el.classList.remove('on'); document.body.classList.remove('locked');
    } else { err.textContent='That PIN is not right. Try again.'; inp.value=''; inp.focus(); }
  };
  document.getElementById('pin-go').addEventListener('click',tryPin);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tryPin(); });
  inp.focus();
})();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
